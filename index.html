<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232321; --surface-3:#2e2e2b;
  --line:#3a3a36; --line-soft:#2b2b28;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e85;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --accent:#3987e5;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --radius:12px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --surface-0:#f4f3ef; --surface-1:#fcfcfb; --surface-2:#f0efec; --surface-3:#e6e5e0;
  --line:#d9d8d2; --line-soft:#e8e7e2;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7975;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --accent:#2a78d6;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface-0); color:var(--text-primary);
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
header.top{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface-0) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
}
.top-inner{max-width:1240px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;letter-spacing:-.02em}
.brand svg{flex:none}
.grow{flex:1}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px}
.tabs button{
  border:0;background:transparent;color:var(--text-secondary);padding:7px 14px;border-radius:8px;
  font-size:13.5px;font-weight:550;transition:.15s;
}
.tabs button:hover{color:var(--text-primary)}
.tabs button[aria-selected="true"]{background:var(--surface-0);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.icon-btn{
  border:1px solid var(--line);background:var(--surface-1);color:var(--text-secondary);
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;transition:.15s;
}
.icon-btn:hover{color:var(--text-primary);border-color:var(--text-muted)}
.btn{
  border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);
  padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:550;transition:.15s;
  display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--text-muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}

/* banner */
.banner{
  margin:14px 0 0;padding:11px 14px;border-radius:10px;font-size:13.5px;
  background:color-mix(in srgb,var(--warning) 12%,var(--surface-1));
  border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);
  color:var(--text-secondary);display:flex;gap:10px;align-items:flex-start;
}
.banner b{color:var(--text-primary)}
.pend-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pend-list .btn{padding:4px 10px;font-size:12px;font-weight:500}
.banner.err{background:color-mix(in srgb,var(--critical) 12%,var(--surface-1));border-color:color-mix(in srgb,var(--critical) 40%,transparent)}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 16px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface-1);outline:none;
}
.search input:focus{border-color:var(--accent)}
select.f, input.f{
  padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-1);outline:none;
  font-size:13.5px;max-width:190px;
}
select.f:focus,input.f:focus{border-color:var(--accent)}
.chip{
  font-size:12px;color:var(--text-muted);padding:5px 9px;border-radius:20px;
  background:var(--surface-2);border:1px solid var(--line-soft);
}

/* ============================================================
   GALERIA
   ============================================================ */
.gallery{
  display:grid;gap:22px 18px;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px}
.cover{
  position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface-2);
  box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease;
  display:grid;place-items:center;
}
.card:hover .cover{transform:translateY(-4px);box-shadow:0 4px 8px rgba(0,0,0,.3),0 16px 36px rgba(0,0,0,.35)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{
  padding:12px;text-align:center;font-size:12px;line-height:1.35;color:var(--text-muted);
  display:flex;flex-direction:column;gap:6px;justify-content:center;height:100%;
}
.cover .ph b{color:var(--text-secondary);font-size:12.5px;font-weight:600}
.badge{
  position:absolute;top:7px;right:7px;background:rgba(10,10,10,.82);color:#fff;
  font-size:11.5px;font-weight:650;padding:3px 7px;border-radius:6px;backdrop-filter:blur(4px);
  letter-spacing:.01em;
}
.badge.pend{background:rgba(201,133,0,.92)}
.fav{position:absolute;top:7px;left:7px;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.card .t{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{font-size:12.5px;color:var(--text-muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* ============================================================
   TABLA
   ============================================================ */
.tablewrap{border:1px solid var(--line-soft);border-radius:var(--radius);overflow:auto;background:var(--surface-1)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{
  font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;
  position:sticky;top:0;background:var(--surface-2);cursor:pointer;white-space:nowrap;user-select:none;
}
th:hover{color:var(--text-primary)}
tbody tr:hover{background:var(--surface-2)}
tbody tr{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td .mini{width:30px;height:45px;border-radius:3px;object-fit:cover;display:block;background:var(--surface-3)}
.obs{color:var(--text-muted);max-width:320px;font-size:12.5px}

/* ============================================================
   MODAL
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
  z-index:100;display:grid;place-items:center;padding:20px;overflow:auto;
}
.modal{
  background:var(--surface-1);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:760px;box-shadow:0 24px 64px rgba(0,0,0,.5);
  max-height:calc(100vh - 40px);display:flex;flex-direction:column;
}
.modal.sm{max-width:520px}
.modal header{
  padding:16px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;flex:none;
}
.modal header h2{font-size:16px;flex:1}
.modal .body{padding:20px;overflow:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:flex-end;flex:none}
.close{border:0;background:transparent;color:var(--text-muted);font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
.close:hover{color:var(--text-primary);background:var(--surface-2)}
.btn.close{border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);font-size:13.5px;line-height:1.5;padding:8px 14px;border-radius:9px}
.btn.close:hover{border-color:var(--text-muted);background:var(--surface-1)}

.detail{display:grid;grid-template-columns:180px 1fr;gap:22px}
.detail .dc{width:100%;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--surface-2);box-shadow:var(--shadow)}
.detail h3{font-size:20px;line-height:1.25;margin-bottom:4px}
.detail .au{color:var(--text-secondary);margin-bottom:14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sinbox{margin:14px 0 0}
.sinbox > b{color:var(--text-primary);display:block;margin-bottom:6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.sinbox.vacia > div{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinbox.vacia .btn{padding:4px 10px;font-size:12.5px}
.sinbox .fuente{font-size:11.5px;color:var(--text-muted);margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinbox .fuente .btn{padding:3px 9px;font-size:11.5px}
.sin-actual,.sin-op{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:14px;margin-bottom:10px}
.sin-actual{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.sin-cab{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:7px}
.sin-txt{font-size:13.5px;color:var(--text-secondary);line-height:1.55;max-height:170px;overflow:auto}
.sinopsis{font-size:13.5px;color:var(--text-secondary);line-height:1.6;max-height:240px;overflow:auto}
.notebox{
  margin:14px 0;padding:12px 14px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line-soft);font-size:13.5px;color:var(--text-secondary);line-height:1.55;
}
.notebox b{color:var(--text-primary);display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stars{color:var(--warning);letter-spacing:2px;font-size:15px}
.notas{display:flex;gap:28px;margin-bottom:14px;flex-wrap:wrap}
.notas .nk{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:2px}
.notas .nsub{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.nota-ext{padding-left:28px;border-left:1px solid var(--line-soft)}
.score{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.score small{font-size:14px;color:var(--text-muted);font-weight:500}

/* form */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-muted);font-weight:550;text-transform:uppercase;letter-spacing:.04em}
label.fld input,label.fld select,label.fld textarea{
  padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  outline:none;font-size:14px;text-transform:none;letter-spacing:0;color:var(--text-primary);font-weight:400;
}
label.fld input:focus,label.fld select:focus,label.fld textarea:focus{border-color:var(--accent)}
label.fld textarea{resize:vertical;min-height:66px;font-family:inherit}
.full{grid-column:1/-1}

/* resultados busqueda */

.ficha-cab{display:flex;gap:16px;margin-bottom:4px}
.ficha-cover{width:84px;flex:none;aspect-ratio:2/3;border-radius:7px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.ficha-cover img{width:100%;height:100%;object-fit:cover;display:block}
.ficha-cover .ph{font-size:11px;color:var(--text-muted);text-align:center;padding:6px}
.ficha-tit{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.auto-nota{font-size:11.5px;color:var(--text-muted)}
.nota-fila{display:flex;gap:12px}
.sep{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--text-muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sep::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.detalles{margin-top:20px;border-top:1px solid var(--line-soft);padding-top:14px}
.detalles summary{cursor:pointer;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.detalles summary::-webkit-details-marker{display:none}
.detalles summary::before{content:"\25B8";transition:transform .15s;display:inline-block}
.detalles[open] summary::before{transform:rotate(90deg)}
.detalles summary:hover{color:var(--text-primary)}
.auto-tag{background:var(--surface-3);color:var(--text-muted);padding:2px 7px;border-radius:20px;font-size:10px;letter-spacing:.03em}

.results{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:14px}
.res{
  display:flex;gap:12px;padding:9px;border-radius:10px;border:1px solid transparent;
  background:transparent;text-align:left;width:100%;align-items:flex-start;
}
.res:hover{background:var(--surface-2);border-color:var(--line-soft)}
.res img{width:52px;height:78px;object-fit:contain;border-radius:4px;flex:none;background:var(--surface-3)}
.res .ri{flex:1;min-width:0}
.res .rt{font-size:13.5px;font-weight:600;line-height:1.3}
.res .rm{font-size:12.5px;color:var(--text-muted);margin-top:2px}

/* ============================================================
   ESTADISTICAS
   ============================================================ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px}
.tile .k{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.panel{background:var(--surface-1);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px}
.panel h3{font-size:14px;margin-bottom:2px}
.panel .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:16px}
.bar-row{display:grid;grid-template-columns:1fr;gap:9px}
.brow{display:grid;grid-template-columns:120px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.brow .lb{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .track{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden;position:relative}
.brow .fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.brow .vl{text-align:right;color:var(--text-secondary);font-variant-numeric:tabular-nums;font-size:12.5px}
.brow:hover .lb,.brow:hover .vl{color:var(--text-primary)}
.dif{margin-left:8px;padding:1px 7px;border-radius:20px;font-weight:650;font-size:11.5px}
.dif.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.dif.down{background:color-mix(in srgb,var(--critical) 16%,transparent);color:var(--critical)}
svg .grid{stroke:var(--line-soft);stroke-width:1}
svg .axis-t{fill:var(--text-muted);font-size:11px}
svg .val-t{fill:var(--text-secondary);font-size:11px;font-weight:600}
svg .col{fill:var(--series-1)}
svg .colhit{fill:transparent;cursor:pointer}
svg g.cg:hover .col{filter:brightness(1.2)}


/* ============================================================
   SUGERENCIAS
   ============================================================ */
.sug-block{margin-bottom:34px}
.sug-block h3{font-size:16px}
.sug-block .sub{font-size:13px;color:var(--text-muted);margin:2px 0 16px}
.sug-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.sug{
  display:flex;gap:14px;padding:14px;border-radius:var(--radius);
  background:var(--surface-1);border:1px solid var(--line-soft);
}
.sug-cover{width:74px;flex:none;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.sug-cover img{width:100%;height:100%;object-fit:cover;display:block}
.sug-cover .ph{padding:8px;text-align:center;font-size:10.5px;color:var(--text-muted);line-height:1.3}
.sug-info{flex:1;min-width:0}
.sug-t{font-size:14.5px;font-weight:650;line-height:1.3}
.sug-a{font-size:12.5px;color:var(--text-muted);margin:2px 0 8px}
.sug-m{font-size:13px;color:var(--text-secondary);line-height:1.5}
.sug-btns{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.sug-btns .btn{padding:6px 11px;font-size:12.5px}
@media (max-width:640px){ .sug-list{grid-template-columns:1fr} }

.filtros{display:contents}
.solo-movil{display:none}
.empty{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty h3{color:var(--text-secondary);margin-bottom:6px;font-size:16px}
.spin{
  width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--surface-3);border:1px solid var(--line);color:var(--text-primary);
  padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.hidden{display:none !important}
@media (max-width:640px){
  .detail{grid-template-columns:1fr}
  .detail .dc{max-width:180px}
  .grid2{grid-template-columns:1fr}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 10px}
  .card .t{font-size:12.5px}
  .card .a{font-size:11.5px}
  .brow{grid-template-columns:88px 1fr 40px}
  .wrap{padding:0 14px 70px}

  /* cabecera: marca y botones en una fila, pestañas deslizables debajo */
  .top-inner{padding:11px 14px;gap:10px}
  .brand{font-size:16px;flex:1}
  .tabs{order:9;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:7px 9px;font-size:12px;white-space:nowrap;flex:none}
  .grow{display:none}
  #btnAdd{padding:8px 12px}

  /* filtros plegados tras un botón */
  .solo-movil{display:grid}
  .filtros{display:none;width:100%;flex-wrap:wrap;gap:8px}
  .filtros.abierto{display:flex}
  .filtros select.f{flex:1 1 calc(50% - 4px);max-width:none}
  .toolbar{gap:8px}
  .search{min-width:0;flex:1 1 100%;order:-1}

  .sug{padding:12px;gap:11px}
  .sug-cover{width:60px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:13px 14px}
  .tile .v{font-size:24px}
  .panels{grid-template-columns:1fr}
  .modal header{padding:14px 16px}
  .modal .body{padding:16px}
  .modal footer{padding:12px 16px;flex-wrap:wrap}
}
</style>
</head>

<header class="top">

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

      <button role="tab" data-tab="sugerencias" aria-selected="false">Sugerencias</button>
      <button role="tab" data-tab="stats" aria-selected="false">Estadísticas</button>
    </div>
    <div class="grow"></div>
    <button class="btn primary" id="btnAdd">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="btnExport" title="Exportar datos">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <div id="banner2"></div>

  <!-- ======== LEIDOS / PENDIENTES ======== -->
  <section id="view-list">
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar por título, autor, género u opinión…" autocomplete="off">
      </div>
      <button class="icon-btn solo-movil" id="btnFiltros" title="Filtros">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      </button>
      <div class="filtros" id="filtros">
      <select class="f" id="fAutor"><option value="">Todos los autores</option></select>
      <select class="f" id="fGenero"><option value="">Todos los géneros</option></select>
      <select class="f" id="fAnio"><option value="">Todos los años</option></select>
      <select class="f" id="fNota">
        <option value="">Cualquier nota</option>
        <option value="9">9 o más</option><option value="8">8 o más</option>
        <option value="7">7 o más</option><option value="6">6 o más</option>
      </select>
      <select class="f" id="fSort">
        <option value="reciente">Ordenar: añadidos ↓</option>
        <option value="titulo">Ordenar: título</option>
        <option value="autor">Ordenar: autor</option>
        <option value="nota">Ordenar: nota ↓</option>
        <option value="anio">Ordenar: año ↓</option>
        <option value="paginas">Ordenar: páginas ↓</option>
      </select>
      </div>
      <button class="icon-btn" id="btnCovers" title="Revisar carátulas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      </button>
      <button class="icon-btn" id="btnView" title="Cambiar vista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="chip" id="count">—</span>
    </div>
    <div id="list"></div>
  </section>

  <!-- ======== SUGERENCIAS ======== -->
  <section id="view-sug" class="hidden"></section>

  <!-- ======== ESTADISTICAS ======== -->
  <section id="view-stats" class="hidden">
    <div class="tiles" id="tiles"></div>
    <div class="panels" id="panels"></div>
  </section>
</div>

function toast(msg, ms=2600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), ms);
}

const api = {
  h(extra={}){
    // Las claves nuevas (sb_publishable_...) NO son JWT: solo van en 'apikey'.
    // Las antiguas (anon, empiezan por eyJ) admiten ademas Authorization: Bearer.
    const base = {'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json'};
    if(/^eyJ/.test(SUPABASE_ANON_KEY)) base['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
    return Object.assign(base, extra);
  },
  base(){
    // tolera: barras finales, espacios y que hayan pegado la URL con /rest/v1 incluido
    return String(SUPABASE_URL || '').trim()
      .replace(/\s+/g,'')
      .replace(/\/+$/,'')
      .replace(/\/rest(\/v1)?$/i,'')
      .replace(/\/+$/,'');
  },
  async req(path, opts={}){
    const r = await fetch(this.base() + '/rest/v1/' + path, opts);
    if(!r.ok) throw new Error((await r.text()) || ('HTTP ' + r.status));
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  list(){ return this.req('libros?select=*&order=creado_en.desc,id.desc', {headers:this.h()}); },
  create(b){ return this.req('libros', {method:'POST', headers:this.h({'Prefer':'return=representation'}), body:JSON.stringify(b)}).then(r=>r[0]); },
  update(id,b){ return this.req('libros?id=eq.'+id, {method:'PATCH', headers:this.h({'Prefer':'return=representation'}), body:JSON.stringify(b)}).then(r=>r&&r[0]); },
  remove(id){ return this.req('libros?id=eq.'+id, {method:'DELETE', headers:this.h()}); },
};

/* ================================================================
   PORTADAS Y METADATOS
   Dos fuentes: Open Library (sin cuota) y Google Books (mejor
   informacion en español, pero con limite diario compartido).
   ================================================================ */
const coverCache = new Map();
let gbBlocked = false, gbMotivo = '', gbConsultas = 0, gbReintentos = 0;   // si Google falla, dejamos de insistir en esta sesión

function normTxt(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function bigCover(u){
  return (u||'').replace(/^http:/,'https:').replace('&edge=curl','').replace(/zoom=\d/,'zoom=2');
}

/* ---- Google Books ---- */
/* Google limita también por minuto: espaciamos las llamadas y reintentamos
   con esperas crecientes antes de dar la fuente por perdida. */
let gbUltima = 0;
const GB_MIN_MS = 700;

async function gbSearch(query, max=12, lang=''){
  if(gbBlocked) throw new Error(gbMotivo || 'Google Books no disponible');
  // 'country' es obligatorio de facto: sin el, responde 403 "Cannot determine user location".
  const url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query)
            + '&maxResults=' + max + '&country=ES'
            + (lang ? '&langRestrict=' + lang : '')
            + (GOOGLE_BOOKS_API_KEY ? '&key=' + encodeURIComponent(GOOGLE_BOOKS_API_KEY) : '');

  const esperas = [2500, 6000];   // reintentos ante un 429 pasajero
  let j = null;
  for(let intento = 0; ; intento++){
    const hueco = GB_MIN_MS - (Date.now() - gbUltima);
    if(hueco > 0) await new Promise(r => setTimeout(r, hueco));
    gbUltima = Date.now();
    gbConsultas++;
    const r = await fetch(url);
    if(r.ok){ j = await r.json(); break; }

    let d = '', razon = '';
    try{
      const e = await r.json();
      d = (e.error && e.error.message) || '';
      razon = (((e.error||{}).errors||[])[0]||{}).reason || '';
    }catch(e){}
    const msg = 'Google Books ' + r.status + (razon ? ' [' + razon + ']' : '') + (d ? ': ' + d.slice(0,200) : '');

    // un 429 suele ser el tope por minuto, no la cuota del día: esperamos y repetimos
    if(r.status === 429 && intento < esperas.length){
      gbReintentos++;
      await new Promise(r2 => setTimeout(r2, esperas[intento]));
      continue;
    }
    if(r.status === 429 || r.status === 403){ gbBlocked = true; gbMotivo = msg; }
    throw new Error(msg);
  }
  return (j.items||[]).map(it => {
    const v = it.volumeInfo || {};
    const ids = {}; (v.industryIdentifiers||[]).forEach(x=>ids[x.type]=x.identifier);
    return {
      titulo: v.title + (v.subtitle ? ': ' + v.subtitle : ''),
      autor: (v.authors||[]).join(', '),
      paginas: v.pageCount || null,
      anio_pub: v.publishedDate ? parseInt(v.publishedDate.slice(0,4),10) : null,
      editorial: v.publisher || null,
      sinopsis: v.description || null,
      isbn: ids.ISBN_13 || ids.ISBN_10 || null,
      genero: (v.categories||[])[0] || null,
      temas: v.categories || [],
      portada: bigCover((v.imageLinks||{}).thumbnail || (v.imageLinks||{}).smallThumbnail || ''),
      idioma: v.language || null,
      rating: v.averageRating || null,
      rating_n: v.ratingsCount || null,
      fuente: 'Google Books',
    };
  });
}

/* ---- Open Library: sin clave, sin cuota ---- */
async function olSearch(query, max=12, lang=''){
  const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(query)
            + '&limit=' + max + (lang ? '&language=' + lang : '')
            + '&fields=key,title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,publisher,language,subject';
  const r = await fetch(url);
  if(!r.ok) throw new Error('Open Library ' + r.status);
  const j = await r.json();
  return (j.docs||[]).filter(d => d.title).map(d => ({
    titulo: d.title,
    autor: (d.author_name||[]).join(', '),
    paginas: d.number_of_pages_median || null,
    anio_pub: d.first_publish_year || null,
    editorial: (d.publisher||[])[0] || null,
    sinopsis: null,
    isbn: (d.isbn||[])[0] || null,
    genero: null,
    portada: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-L.jpg' : '',
    idioma: (d.language||[]).includes('spa') ? 'es' : ((d.language||[])[0] || null),
    fuente: 'Open Library',
    solo_es: (d.language||[]).length === 1 && (d.language||[])[0] === 'spa',
    temas: (d.subject||[]).slice(0,25),
    obra: d.key || null,   // /works/OL...W -> de ahí sale la sinopsis
  }));
}

/* ---- sinopsis desde Open Library: 2ª llamada, sin cuota ---- */
const sinopsisCache = new Map();
async function olSinopsis(obra){
  if(!obra) return null;
  if(sinopsisCache.has(obra)) return sinopsisCache.get(obra);
  const p = (async () => {
    try{
      const r = await fetch('https://openlibrary.org' + obra + '.json');
      if(!r.ok) return null;
      const j = await r.json();
      const d = j.description;
      return typeof d === 'string' ? d : (d && d.value) || null;
    }catch(e){ return null; }
  })();
  sinopsisCache.set(obra, p);
  return p;
}

function limpiaSinopsis(t){
  if(!t) return null;
  return String(t)
    .replace(/<[^>]+>/g, ' ')
    .replace(/-{5,}[\s\S]*$/, '')
    .replace(/\(?\[?source:[^\)\]]*[\)\]]?\s*$/i, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 1800) || null;
}


/* ---- valoración de lectores en Open Library ---- */
const ratingCache = new Map();
async function olRating(obra){
  if(!obra) return null;
  if(ratingCache.has(obra)) return ratingCache.get(obra);
  const p = (async () => {
    try{
      const r = await fetch('https://openlibrary.org' + obra + '/ratings.json');
      if(!r.ok) return null;
      const j = await r.json();
      const s = j.summary || {};
      if(!s.average || !s.count) return null;
      return {media: Math.round(s.average * 10) / 10, votos: s.count};
    }catch(e){ return null; }
  })();
  ratingCache.set(obra, p);
  return p;
}

/* localiza la ficha del libro en Open Library (hace falta para nota y sinopsis,
   porque si el emparejamiento lo gana Google no traemos la clave de la obra) */
const obraCache = new Map();
async function obraOL(book){
  const k = normTxt(book.titulo) + '|' + normTxt(book.autor);
  if(obraCache.has(k)) return obraCache.get(k);
  const p = (async () => {
    const t = book.titulo, a = book.autor || '';
    for(const [q, lang] of [['title:"'+t+'" author:"'+a+'"','spa'], [t+' '+a, ''], ['title:"'+t+'" author:"'+a+'"','']]){
      try{
        const items = await olSearch(q, 8, lang);
        const h = mejorCoincidencia(items, t, a, false);
        if(h && h.obra) return h.obra;
      }catch(e){}
    }
    return null;
  })();
  obraCache.set(k, p);
  return p;
}

/* la mejor valoración disponible: gana la que tenga más votos */
async function buscarRating(book, hitPrevio){
  const hit = hitPrevio !== undefined ? hitPrevio : await resolveCover(book, false);
  const opciones = [];
  if(hit && hit.rating) opciones.push({media: hit.rating, votos: hit.rating_n || 0, fuente: 'Google Books'});
  const obra = (hit && hit.obra) || await obraOL(book);
  if(obra){
    const ol = await olRating(obra);
    if(ol) opciones.push({media: ol.media, votos: ol.votos, fuente: 'Open Library'});
  }
  if(!opciones.length) return null;
  return opciones.sort((a,b) => b.votos - a.votos)[0];
}

/* ---- sinopsis desde la Wikipedia en español (sin clave, sin cuota) ---- */
async function wikiSinopsis(titulo, autor){
  const consulta = titulo + ' ' + (autor || '') + ' novela libro';
  const url = 'https://es.wikipedia.org/w/api.php?action=query&format=json&origin=*'
            + '&generator=search&gsrlimit=5&gsrsearch=' + encodeURIComponent(consulta)
            + '&prop=extracts&exintro=1&explaintext=1&redirects=1';
  const r = await fetch(url);
  if(!r.ok) throw new Error('Wikipedia ' + r.status);
  const j = await r.json();
  const paginas = Object.values(((j.query||{}).pages) || {});
  const ape = normTxt(autor||'').split(' ').filter(Boolean).pop();
  const tn = normTxt(titulo);
  for(const p of paginas){
    const ext = (p.extract || '').trim();
    if(ext.length < 140) continue;                       // fichas vacías o de desambiguación
    const en = normTxt(ext), pn = normTxt(p.title||'');
    if(ape && !en.includes(ape)) continue;               // debe mencionar al autor
    if(!pn.includes(tn) && !en.includes(tn)) continue;   // y ser de ESE libro
    if(/puede referirse a|desambiguacion/.test(en.slice(0,200))) continue;
    return ext;
  }
  return null;
}

/* busca la sinopsis donde sea. Devuelve {texto, fuente} o null. */
async function buscarSinopsis(book, hitPrevio){
  const hit = hitPrevio !== undefined ? hitPrevio : await resolveCover(book, false);
  if(hit && hit.sinopsis){
    const t = limpiaSinopsis(hit.sinopsis);
    if(t) return {texto: t, fuente: hit.fuente || 'Google Books'};
  }
  const obra = (hit && hit.obra) || await obraOL(book);
  if(obra){
    const t = limpiaSinopsis(await olSinopsis(obra));
    if(t) return {texto: t, fuente: 'Open Library'};
  }
  try{
    const t = limpiaSinopsis(await wikiSinopsis(book.titulo, book.autor));
    if(t) return {texto: t, fuente: 'Wikipedia'};
  }catch(e){}
  return null;
}

/* ---- consulta a las dos fuentes, en el orden que se pida ---- */
const FUENTES = {
  ol: {nombre:'Open Library', fn: olSearch, exacta: (t,a) => 'title:"'+t+'" author:"'+a+'"'},
  gb: {nombre:'Google Books', fn: gbSearch, exacta: (t,a) => 'intitle:"'+t+'" inauthor:"'+a+'"'},
};

/* busca en varias fuentes y devuelve los primeros resultados utiles */
async function buscarLibro(texto, orden = ['gb','ol'], max = 14){
  let err = null;
  for(const k of orden){
    try{
      const items = await FUENTES[k].fn(texto, max);
      if(items.length) return items;
    }catch(e){ err = e; }
  }
  if(err) throw err;
  return [];
}

/* elige el mejor resultado con portada para un libro concreto */
function mejorCoincidencia(items, titulo, autor, exigirPortada = true){
  const tn = normTxt(titulo), an = normTxt(autor).split(' ').pop();
  let best = null;
  for(const it of items){
    if(exigirPortada && !it.portada) continue;
    const itn = normTxt(it.titulo);
    let sc = 0;
    if(itn === tn) sc += 10; else if(itn.startsWith(tn) || tn.startsWith(itn)) sc += 7; else if(itn.includes(tn)) sc += 4;
    if(an && normTxt(it.autor).includes(an)) sc += 5;
    if(it.solo_es) sc += 6; else if(it.idioma === 'es') sc += 3;
    if(!best || sc > best.sc) best = {sc, it};
  }
  return (best && best.sc >= 6) ? best.it : null;
}

/* busca la portada de un libro. Open Library primero: no tiene cuota. */
async function resolveCover(book, exigirPortada = true){
  const key = normTxt(book.titulo) + '|' + normTxt(book.autor) + '|' + (exigirPortada ? 'p' : '-');
  if(coverCache.has(key)) return coverCache.get(key);
  const p = (async () => {
    let err = null;
    const t = book.titulo, a = book.autor || '';
    // Google se consulta como MUCHO 2 veces por libro: su cuota diaria es limitada.
    // Open Library no tiene cuota, así que ahí sí insistimos más.
    const gb = [
      [gbSearch, 'intitle:"'+t+'" inauthor:"'+a+'"', 'es'],
      [gbSearch, t + ' ' + a, 'es'],
    ];
    const ol = [
      [olSearch, 'title:"'+t+'" author:"'+a+'"', 'spa'],
      [olSearch, t + ' ' + a, 'spa'],
      [olSearch, 'title:"'+t+'" author:"'+a+'"', ''],
      [olSearch, t + ' ' + a, ''],
    ];
    const intentos = GOOGLE_BOOKS_API_KEY ? gb.concat(ol) : ol.concat(gb);
    for(const [fn, q, idioma] of intentos){
      let items = [];
      try{ items = await fn(q, 12, idioma); err = null; }catch(e){ err = e; continue; }
      const hit = mejorCoincidencia(items, t, a, exigirPortada);
      if(hit) return hit;
    }
    if(err) throw err;
    return null;
  })();
  coverCache.set(key, p);
  return p;
}

/* carátulas rescatadas del Excel original, por titulo+autor */
const SEED_COVERS = new Map(SEED.filter(s => s.portada).map(s => [normTxt(s.titulo)+'|'+normTxt(s.autor), s.portada]));

let fillRunning = false;

/* completa portadas que faltan: 1º las de tu Excel, 2º Google Books */
async function fillCovers(forzar = false){
  if(fillRunning) return;
  fillRunning = true;
  try{
    // --- 1) las 20 que ya venían en tu Excel: instantáneas y sin depender de internet
    let local = 0;
    for(const b of state.books.filter(b => !b.portada)){
      const hit = SEED_COVERS.get(normTxt(b.titulo)+'|'+normTxt(b.autor));
      if(hit){ await persist(b, {portada: hit}); local++; }
    }
    if(local){ render(); toast('Recuperadas ' + local + ' carátulas de tu Excel'); }

    // --- 2) el resto contra los catálogos: portada, sinopsis, valoración y datos sueltos
    // 'visible' es lo que le importa al usuario; 'pendiente' incluye además la
    // valoración, que solo se intenta una vez por libro (marca 'enriquecido')
    // para no gastar consultas en cada recarga.
    const visible   = b => !b.portada || !b.sinopsis;
    const pendiente = b => forzar || !b.enriquecido;
    const pend = state.books.filter(pendiente);
    coversBanner(state.books.filter(visible).length, null, pend.length ? 'buscando' : '');
    let done = 0, lastErr = null;
    for(const b of pend){
      try{
        const hit = await resolveCover(b, !b.portada);
        if(!hit && !b.sinopsis){
          const s = await buscarSinopsis(b, null);
          if(s) await persist(b, {sinopsis: s.texto, sinopsis_fuente: s.fuente}), done++, render();
        }
        if(hit){
          const patch = {};
          if(!b.portada   && hit.portada)   patch.portada   = hit.portada;
          if(!b.paginas   && hit.paginas)   patch.paginas   = hit.paginas;
          if(!b.isbn      && hit.isbn)      patch.isbn      = hit.isbn;
          if(!b.editorial && hit.editorial) patch.editorial = hit.editorial;
          if(!b.anio_pub  && hit.anio_pub)  patch.anio_pub  = hit.anio_pub;
          if(!b.genero){ const g = deducirGenero(hit); if(g) patch.genero = g; }
          if(!b.sinopsis){
            const s = await buscarSinopsis(b, hit);
            if(s){ patch.sinopsis = s.texto; patch.sinopsis_fuente = s.fuente; }
          }
          if(b.rating_ext == null){
            const v = await buscarRating(b, hit);
            if(v){ patch.rating_ext = v.media; patch.rating_votos = v.votos; patch.rating_fuente = v.fuente; }
          }
          if(Object.keys(patch).length){ await persist(b, patch); done++; render(); }
        }
      }catch(e){ lastErr = e; }
      // Se haya encontrado algo o no, este libro ya se ha intentado: no se
      // vuelve a consultar en cada recarga. El botón Reintentar lo fuerza.
      if(!b.enriquecido){ try{ await persist(b, {enriquecido: new Date().toISOString()}); }catch(e){} }
      coversBanner(state.books.filter(visible).length, lastErr, 'buscando');
      await new Promise(r => setTimeout(r, 220));
    }
    if(done) toast('He completado ' + done + ' ficha' + (done>1?'s':''));
    coversBanner(state.books.filter(visible).length, lastErr, '');
  } finally { fillRunning = false; }
}

    ? '<br><span style="color:var(--text-muted)">Google Books ha agotado su cuota del día; se reinicia sobre las 9:00 (hora española). '

    + '<div style="flex:1">'
    + (fase === 'buscando' ? 'Completando fichas… quedan <b>' + faltan + '</b>.' : 'Fichas por completar: <b>' + detalle + '</b>.')
    + motivo + lista + '</div>'
    + (fase === 'buscando' ? '' : '<button class="btn" id="reCovers" style="flex:none">Reintentar</button>')
    + (fase === 'buscando' || !GOOGLE_BOOKS_API_KEY ? '' : '<button class="btn" id="probarGB" style="flex:none">Probar la clave</button>')
    + '</div>';
  const rb = host.querySelector('#reCovers');

}

/* el género que tú sueles ponerle a ese autor */
function generoDelAutor(autor){
  if(!autor) return null;
  const an = normTxt(autor);
  const cuenta = new Map();
  state.books.forEach(b => {
    if(!b.genero || !b.autor) return;
    if(normTxt(b.autor) !== an) return;
    cuenta.set(b.genero, (cuenta.get(b.genero)||0) + 1);
  });
  if(!cuenta.size) return null;
  return [...cuenta.entries()].sort((a,b) => b[1]-a[1])[0][0];
}

function deducirGenero(it){
  const propio = generoDelAutor(it.autor);
  if(propio) return propio;
  const texto = [(it.temas||[]).join(' '), it.genero||''].join(' ');
  for(const [re, g] of MAPA_GENERO) if(re.test(texto)) return g;
  return it.genero || null;
}

/* ================================================================
   FILTRADO / ORDEN
   ================================================================ */
function filtered(){
  const q  = normTxt($('#q').value);
  const fa = $('#fAutor').value, fg = $('#fGenero').value, fy = $('#fAnio').value, fn = +$('#fNota').value || 0;
  const wantPend = state.tab === 'pendientes';
  let out = state.books.filter(b => {
    const isPend = b.estado === 'pendiente';
    if(wantPend !== isPend) return false;
    if(fa && b.autor !== fa) return false;
    if(fg && b.genero !== fg) return false;
    if(fy && String(b.anio_lectura) !== fy) return false;
    if(fn && !(b.nota >= fn)) return false;
    if(q){
      const hay = normTxt([b.titulo,b.autor,b.genero,b.observaciones,b.editorial].join(' '));
      if(!q.split(' ').every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const s = $('#fSort').value;
  const col = new Intl.Collator('es', {sensitivity:'base'});
  const byNum = k => (a,b) => (b[k] ?? -1) - (a[k] ?? -1) || col.compare(a.titulo, b.titulo);
  ({
    titulo:  () => out.sort((a,b)=>col.compare(a.titulo,b.titulo)),
    autor:   () => out.sort((a,b)=>col.compare(a.autor||'',b.autor||'') || col.compare(a.titulo,b.titulo)),
    nota:    () => out.sort(byNum('nota')),
    anio:    () => out.sort(byNum('anio_lectura')),
    paginas: () => out.sort(byNum('paginas')),
    reciente:() => out.sort((a,b)=>
      String(b.creado_en||'').localeCompare(String(a.creado_en||'')) ||
      (parseInt(b.id,10)||0) - (parseInt(a.id,10)||0) ||
      col.compare(a.titulo,b.titulo)),
  })[s]();
  return out;
}

function refreshFilters(){
  const set = (sel, vals, fmt = v=>v) => {
    const el = $(sel), cur = el.value;
    const first = el.options[0].textContent;
    el.innerHTML = '<option value="">'+first+'</option>' + vals.map(v=>'<option value="'+esc(v)+'">'+esc(fmt(v))+'</option>').join('');
    el.value = vals.map(String).includes(cur) ? cur : '';
  };
  const col = new Intl.Collator('es',{sensitivity:'base'});
  set('#fAutor',  [...new Set(state.books.map(b=>b.autor).filter(Boolean))].sort(col.compare));
  set('#fGenero', [...new Set(state.books.map(b=>b.genero).filter(Boolean))].sort(col.compare));
  set('#fAnio',   [...new Set(state.books.map(b=>b.anio_lectura).filter(Boolean))].sort((a,b)=>b-a));
}

   ================================================================ */
function stars(n){
  if(n == null) return '';
  const f = Math.round(n/2);
  return '★'.repeat(f) + '<span style="color:var(--text-muted)">' + '★'.repeat(5-f) + '</span>';
}
function starsExt(n){
  if(n == null) return '';
  const f = Math.round(n);
  return '★'.repeat(f) + '<span style="color:var(--text-muted)">' + '★'.repeat(Math.max(0, 5-f)) + '</span>';
}
function coverHTML(b, cls){
  if(b.portada) return '<img class="'+cls+'" src="'+esc(b.portada)+'" alt="Portada de '+esc(b.titulo)+'" loading="lazy" onerror="this.remove()">';
  return '<div class="ph"><b>'+esc(b.titulo)+'</b><span>'+esc(b.autor||'')+'</span></div>';
}

function render(){
  const rows = filtered();
  $('#count').textContent = rows.length + (rows.length === 1 ? ' libro' : ' libros');
  const host = $('#list');
  if(!rows.length){
    host.innerHTML = '<div class="empty"><h3>Nada por aquí</h3><p>'
      + (state.tab==='pendientes' ? 'Aún no tienes libros pendientes. Añade uno y márcalo como «Pendiente».' : 'Ningún libro coincide con los filtros.')
      + '</p></div>';
    return;
  }
  host.innerHTML = state.view === 'galeria' ? galeria(rows) : tabla(rows);
  host.querySelectorAll('[data-id]').forEach(el => el.onclick = () => openDetail(el.dataset.id));
  if(state.view === 'tabla') $$('#list th[data-k]').forEach(th => th.onclick = () => sortBy(th.dataset.k));
}

function galeria(rows){
  return '<div class="gallery">' + rows.map(b => `
    <button class="card" data-id="${esc(b.id)}">
      <div class="cover">
        ${coverHTML(b,'')}
        ${b.favorito ? '<span class="fav">⭐</span>' : ''}

            ? '<span class="badge pend">Pendiente</span>'
            : (b.nota != null ? '<span class="badge">'+b.nota+'</span>' : '')}

      <div class="t">${esc(b.titulo)}</div>
      <div class="a">${esc(b.autor||'—')}</div>

function tabla(rows){
  const cols = [['titulo','Título'],['autor','Autor'],['genero','Género'],['paginas','Págs.'],['nota','Nota'],['anio_lectura','Año'],['observaciones','Opinión']];

function sortBy(k){
  const map = {titulo:'titulo', autor:'autor', nota:'nota', anio_lectura:'anio', paginas:'paginas'};
  if(map[k]){ $('#fSort').value = map[k]; render(); }

function openModal(html, cls=''){
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = '<div class="modal '+cls+'">' + html + '</div>';
  wrap.onclick = e => { if(e.target === wrap) wrap.remove(); };
  document.addEventListener('keydown', function k(e){
    if(e.key === 'Escape'){ wrap.remove(); document.removeEventListener('keydown', k); }
  });
  $('#modals').appendChild(wrap);
  wrap.querySelectorAll('.close').forEach(b => b.onclick = () => wrap.remove());
  return wrap;
}

          </div>
        </button>`).join('');
      out.querySelectorAll('.res').forEach(btn => btn.onclick = () => {
        const it = items[+btn.dataset.i];
        const pend = state.tab === 'pendientes';
        m.remove();
        openForm(null, {
          titulo: it.titulo, autor: it.autor, paginas: it.paginas, portada: it.portada,
          editorial: it.editorial, anio_pub: it.anio_pub, isbn: it.isbn, sinopsis: it.sinopsis,
          genero: deducirGenero(it),
          estado: pend ? 'pendiente' : 'leido',
          anio_lectura: pend ? null : new Date().getFullYear(),
        });
      });
    }, 380);
  };
}

      const hit = mejorCoincidencia(items, t, a, false);
      const x = hit && limpiaSinopsis(hit.sinopsis);
      return x ? {fuente:'Google Books', texto:x} : null;
    })(),
    (async () => {
      let items = await olSearch('title:"'+t+'" author:"'+a+'"', 8, 'spa');
      let hit = mejorCoincidencia(items, t, a, false);
      if(!hit){ items = await olSearch(t+' '+a, 8); hit = mejorCoincidencia(items, t, a, false); }
      if(!hit || !hit.obra) return null;
      const x = limpiaSinopsis(await olSinopsis(hit.obra));
      return x ? {fuente:'Open Library', texto:x} : null;
    })(),
    (async () => {
      const x = limpiaSinopsis(await wikiSinopsis(t, a));
      return x ? {fuente:'Wikipedia', texto:x} : null;
    })(),
  ];
  const res = await Promise.allSettled(tareas);
  const vistos = new Set(), out = [];
  for(const r of res){
    const v = r.status === 'fulfilled' ? r.value : null;
    if(!v || vistos.has(v.texto.slice(0,90))) continue;
    vistos.add(v.texto.slice(0,90)); out.push(v);
  }
  return out;
}

/* comprueba la clave de Google Books y dice exactamente qué contesta */
async function probarGoogle(btn){
  if(btn){ btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; }

      ok = true;
      titulo = 'La clave funciona';

             + 'Si antes fallaba era algo puntual: pulsa Reintentar.'

             + (gbReintentos ? ' (' + gbReintentos + ' reintentos por tope por minuto)' : '') + '.';
      gbBlocked = false; gbMotivo = '';
    } else {
      const razon = (((j.error||{}).errors||[])[0]||{}).reason || '';
      titulo = 'Google responde ' + r.status + (razon ? ' · ' + razon : '');
      cuerpo = ((j.error||{}).message) || 'Sin detalle.';
      const pistas = {
        rateLimitExceeded: 'Si el consumo del día es bajo, no es la cuota diaria sino el tope por minuto: la web ya espacia y reintenta las llamadas. Comprueba el límite real en console.cloud.google.com → APIs y servicios → Books API → Cuotas.',
        dailyLimitExceeded: 'Cuota diaria agotada. Se reinicia a medianoche (hora del Pacífico).',
        accessNotConfigured: 'La Books API no está habilitada en el proyecto de esa clave. Habilítala en console.cloud.google.com/apis/library/books.googleapis.com',
        forbidden: 'Suele ser una restricción de la clave: revisa que esté limitada a Books API y que NO tenga restricción por sitio web (no funciona abriendo el archivo con doble clic).',
        keyInvalid: 'La clave no es válida: revisa que la copiaste entera y sin espacios.',
        ipRefererBlocked: 'La clave tiene restricción por sitio web o por IP. Quítala mientras uses el archivo en local.',
      };
      cuerpo += pistas[razon] ? '\n\n' + pistas[razon] : '';
      cuerpo += '\n\nConsultas a Google en esta sesión: ' + gbConsultas
             + (gbReintentos ? ' (' + gbReintentos + ' reintentos por tope por minuto)' : '') + '.'
             + '\nConsumo real y límite: console.cloud.google.com/apis/api/books.googleapis.com/quotas';
    }
  }catch(e){
    titulo = 'No he podido ni conectar';
    cuerpo = String(e.message);
  }
  openModal('<header><h2>' + esc(titulo) + '</h2><button class="close" aria-label="Cerrar">×</button></header>'
    + '<div class="body"><p style="font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin:0;color:var(--text-secondary)">'
    + esc(cuerpo) + '</p></div>'
    + '<footer><button class="btn close">Cerrar</button></footer>', 'sm');
  if(btn){ btn.textContent = 'Probar la clave'; btn.disabled = false; }
  if(ok) refrescaAviso();
}

/* ---- rebusca en Google Books las sinopsis que vengan de otro sitio ---- */
function mejorables(){
  return state.books.filter(b => b.sinopsis && b.sinopsis_fuente
    && b.sinopsis_fuente !== 'Google Books' && b.sinopsis_fuente !== 'ti');
}
async function rebuscarSinopsis(){
  if(fillRunning) return;
  fillRunning = true;
  const lista = mejorables();
  let n = 0, err = null;
  try{
    for(const b of lista){
      try{
        const items = await gbSearch('intitle:"'+b.titulo+'" inauthor:"'+(b.autor||'')+'"', 8, 'es');
        const hit = mejorCoincidencia(items, b.titulo, b.autor||'', false);
        const t = hit && limpiaSinopsis(hit.sinopsis);
        if(t){ await persist(b, {sinopsis: t, sinopsis_fuente: 'Google Books'}); n++; render(); }
      }catch(e){ err = e; }
      coversBanner(state.books.filter(x => !x.portada || !x.sinopsis).length, err, 'buscando');
      await new Promise(r => setTimeout(r, 200));
    }
  } finally { fillRunning = false; }
  toast(n ? 'He mejorado ' + n + ' sinopsis con Google Books' : 'Google Books no mejora ninguna');
  coversBanner(state.books.filter(x => !x.portada || !x.sinopsis).length, err, '');
}

/* ---- candidatos de portada: mezcla las dos fuentes, español primero ---- */
async function candidatosPortada(b){
  const t = b.titulo, a = b.autor || '';
  const ol = [
    () => olSearch('title:"'+t+'" author:"'+a+'"', 14, 'spa'),
    () => olSearch(t+' '+a, 14, 'spa'),
    () => olSearch('title:"'+t+'" author:"'+a+'"', 14),
  ];
  const gb = [
    () => gbSearch('intitle:"'+t+'" inauthor:"'+a+'"', 14, 'es'),
    () => gbSearch(t+' '+a, 14, 'es'),
    () => gbSearch('intitle:"'+t+'" inauthor:"'+a+'"', 14),
  ];
  const intentos = GOOGLE_BOOKS_API_KEY ? gb.concat(ol) : ol.concat(gb);
  const vistos = new Set(), out = [];
  let err = null;
  for(const f of intentos){
    let items = [];
    try{ items = await f(); }catch(e){ err = e; continue; }
    for(const it of items){
      if(!it.portada || vistos.has(it.portada)) continue;
      vistos.add(it.portada); out.push(it);
    }
    if(out.length >= 16) break;
  }
  if(!out.length && err) throw err;
  return out;
}

/* ================================================================
   ESTADISTICAS
   ================================================================ */
function renderStats(){
  const leidos = state.books.filter(b => b.estado !== 'pendiente');
  const notas  = leidos.map(b=>b.nota).filter(n=>n!=null);
  const pags   = leidos.map(b=>b.paginas).filter(Boolean);
  const media  = notas.length ? (notas.reduce((a,b)=>a+b,0)/notas.length) : null;
  const totalP = pags.reduce((a,b)=>a+b,0);

  const tile = (k,v,s='') => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s?'<div class="s">'+s+'</div>':''}</div>`;
  $('#tiles').innerHTML =
      tile('Libros leídos', leidos.length, state.books.filter(b=>b.estado==='pendiente').length + ' pendientes')
    + tile('Páginas leídas', totalP.toLocaleString('es-ES'), pags.length + ' de ' + leidos.length + ' libros con dato')
    + tile('Nota media', media != null ? media.toFixed(1) : '—', notas.length + ' libros valorados')
    + tile('Autores distintos', new Set(leidos.map(b=>b.autor).filter(Boolean)).size, new Set(leidos.map(b=>b.genero).filter(Boolean)).size + ' géneros')
    + tile('Libro más largo', pags.length ? Math.max(...pags).toLocaleString('es-ES') : '—',
           pags.length ? esc(leidos.find(b=>b.paginas===Math.max(...pags)).titulo) : '');

  const byYear = tally(leidos.filter(b=>b.anio_lectura), b=>b.anio_lectura);
  const years  = [...byYear.keys()].sort((a,b)=>a-b);
  const pagsYear = new Map(years.map(y => [y, leidos.filter(b=>b.anio_lectura===y).reduce((a,b)=>a+(b.paginas||0),0)]));

  const genres = topN(tally(leidos, b=>b.genero), 8);
  const authors= topN(tally(leidos, b=>b.autor), 8);
  const notaDist = [...Array(11).keys()].map(n => [n, notas.filter(x=>x===n).length]).filter(([n,c])=>c>0);

  $('#panels').innerHTML = [
    panel('Libros por año de lectura', 'Cuántos terminaste cada año',
          years.length ? columns(years.map(y=>[String(y), byYear.get(y)]), v=>v+(v===1?' libro':' libros')) : vacio()),
    panel('Páginas por año', 'Volumen de lectura anual',
          years.length ? columns(years.map(y=>[String(y), pagsYear.get(y)]), v=>v.toLocaleString('es-ES')+' págs.') : vacio()),
    panel('Géneros más leídos', 'Top 8 por número de libros', bars(genres, v=>v)),
    panel('Autores más leídos', 'Top 8 por número de libros', bars(authors, v=>v)),
    panel('Reparto de notas', 'Cuántos libros por puntuación',
          notaDist.length ? columns(notaDist.map(([n,c])=>[String(n), c]), v=>v+(v===1?' libro':' libros')) : vacio()),
    panel('Mejor valorados', 'Tus notas más altas', ranking(leidos)),
    panel('Tú contra el resto', 'Donde más te separas de la nota de los lectores', discrepancias(leidos)),
  ].join('');
}

function vacio(){ return '<p style="color:var(--text-muted);font-size:13.5px">Sin datos suficientes.</p>'; }
function panel(t,s,body){ return '<div class="panel"><h3>'+t+'</h3><div class="sub">'+s+'</div>'+body+'</div>'; }
function tally(arr, key){
  const m = new Map();
  arr.forEach(x => { const k = key(x); if(k==null||k==='') return; m.set(k, (m.get(k)||0)+1); });
  return m;
}
function topN(map, n){ return [...map.entries()].sort((a,b)=>b[1]-a[1] || String(a[0]).localeCompare(String(b[0]))).slice(0,n); }

/* barras horizontales (categorias nominales, un solo color) */
function bars(pairs, fmt){
  if(!pairs.length) return vacio();
  const max = Math.max(...pairs.map(p=>p[1]));
  return '<div class="bar-row">' + pairs.map(([k,v]) => `
    <div class="brow" title="${esc(k)}: ${fmt(v)}">
      <div class="lb">${esc(k)}</div>
      <div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
      <div class="vl">${fmt(v)}</div>
    </div>`).join('') + '</div>';
}

/* columnas verticales en SVG, una sola serie -> sin leyenda */
function columns(pairs, tip){
  if(!pairs.length) return vacio();
  const W = 460, H = 190, PL = 40, PR = 10, PT = 18, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const max = Math.max(...pairs.map(p=>p[1]));
  const step = niceStep(max);
  const top = Math.ceil(max/step)*step || 1;
  const band = iw / pairs.length;
  const bw = Math.min(24, band - 6);
  const ticks = []; for(let t=0; t<=top; t+=step) ticks.push(t);
  const showEvery = pairs.length > 12 ? Math.ceil(pairs.length/10) : 1;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block;overflow:visible">
    ${ticks.map(t=>{const y=PT+ih-(t/top)*ih;return `<line class="grid" x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="axis-t" x="${PL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${t.toLocaleString('es-ES')}</text>`;}).join('')}
    ${pairs.map(([k,v],i)=>{
      const h = top ? (v/top)*ih : 0;
      const x = PL + band*i + (band-bw)/2, y = PT + ih - h;
      const isMax = v === max;
      return `<g class="cg"><title>${esc(k)}: ${tip(v)}</title>
        <path class="col" d="M${x.toFixed(1)},${(PT+ih).toFixed(1)} L${x.toFixed(1)},${(y+Math.min(4,h)).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+Math.min(4,h/2)).toFixed(1)},${y.toFixed(1)} L${(x+bw-Math.min(4,h/2)).toFixed(1)},${y.toFixed(1)} Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+Math.min(4,h)).toFixed(1)} L${(x+bw).toFixed(1)},${(PT+ih).toFixed(1)} Z"/>
        ${isMax && h > 14 ? `<text class="val-t" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${v.toLocaleString('es-ES')}</text>` : ''}
        <rect class="colhit" x="${(PL+band*i).toFixed(1)}" y="${PT}" width="${band.toFixed(1)}" height="${ih}"/>
      </g>`;
    }).join('')}
    <line class="grid" x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}"/>
    ${pairs.map(([k],i)=> i % showEvery ? '' : `<text class="axis-t" x="${(PL+band*i+band/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(k)}</text>`).join('')}
  </svg>`;
}
function niceStep(max){
  if(max <= 5) return 1;
  const raw = max/4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/mag;
  return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
}

/* comparativa entre tu nota y la de los lectores, ambas llevadas a base 10 */
function discrepancias(leidos){
  const con = leidos.filter(b => b.nota != null && b.rating_ext)
    .map(b => ({b, ext: b.rating_ext * 2, dif: b.nota - b.rating_ext * 2}))
    .sort((x, y) => Math.abs(y.dif) - Math.abs(x.dif))
    .slice(0, 8);
  if(!con.length) return '<p style="color:var(--text-muted);font-size:13.5px">Todavía no tengo la nota de los lectores de ningún libro.</p>';
  return '<div class="bar-row">' + con.map(({b, ext, dif}) => `
    <div class="brow" style="grid-template-columns:1fr auto;gap:12px" title="${esc(b.titulo)}">
      <div class="lb">${esc(b.titulo)} <span style="color:var(--text-muted)">· ${esc(b.autor||'')}</span></div>
      <div style="white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px">
        <b>${b.nota}</b><span style="color:var(--text-muted)"> vs ${ext.toFixed(1).replace('.',',')}</span>
        <span class="dif ${dif > 0 ? 'up' : 'down'}">${dif > 0 ? '+' : ''}${dif.toFixed(1).replace('.',',')}</span>
      </div>
    </div>`).join('') + '</div>'
    + '<p style="font-size:11.5px;color:var(--text-muted);margin:14px 0 0">Las notas de lectores van de 0 a 5; aquí están dobladas a base 10 para poder compararlas.</p>';
}

function ranking(leidos){
  const top = leidos.filter(b=>b.nota!=null).sort((a,b)=>b.nota-a.nota).slice(0,8);
  if(!top.length) return vacio();
  return '<div class="bar-row">' + top.map(b=>`
    <div class="brow" style="grid-template-columns:1fr auto;gap:12px">
      <div class="lb" title="${esc(b.titulo)}">${esc(b.titulo)} <span style="color:var(--text-muted)">· ${esc(b.autor||'')}</span></div>
      <div style="white-space:nowrap"><span class="stars" style="font-size:12px">${stars(b.nota)}</span> <b style="font-variant-numeric:tabular-nums">${b.nota}</b></div>
    </div>`).join('') + '</div>';
}


/* ================================================================
   SUGERENCIAS
   Dos capas: una lista curada (se siembra en Supabase la 1ª vez)

api.listSug    = function(){ return this.req('sugerencias?select=*&order=id.asc', {headers:this.h()}); };
api.createSug  = function(rows){ return this.req('sugerencias', {method:'POST', headers:this.h({'Prefer':'return=representation'}), body:JSON.stringify(rows)}); };
api.updateSug  = function(id, b){ return this.req('sugerencias?id=eq.'+id, {method:'PATCH', headers:this.h({'Prefer':'return=representation'}), body:JSON.stringify(b)}).then(r=>r&&r[0]); };

state.sug = [];
state.sugCargadas = false;
state.verDescartadas = false;

const yaLoTengo = t => state.books.some(b => normTxt(b.titulo) === normTxt(t));

async function cargarSugerencias(){
  if(state.sugCargadas) return;
  state.sugCargadas = true;
  if(state.online){
    try{
      state.sug = await api.listSug();
      // Siembra incremental: mete solo las que no estén ya, comparando por
      // título+autor. Así una tanda nueva mía entra sola, sin tocar SQL,
      // y sin resucitar las que tú ya descartaste.
      const hay = new Set(state.sug.map(s => normTxt(s.titulo)+'|'+normTxt(s.autor)));
      const nuevas = SUG_SEED.filter(s => !hay.has(normTxt(s.titulo)+'|'+normTxt(s.autor)));
      if(nuevas.length){
        const creadas = await api.createSug(nuevas);
        state.sug = state.sug.concat(creadas || []);
        if(state.sug.length > nuevas.length) toast(nuevas.length + ' sugerencias nuevas');
      }
      return;
    }catch(e){
      state.sug = SUG_SEED.map((s,i)=>Object.assign({id:'s-'+i, estado:'nueva'}, s));
      state.sugError = e;
      return;
    }
  }
  state.sug = SUG_SEED.map((s,i)=>Object.assign({id:'s-'+i, estado:'nueva'}, s));
}

async function persistSug(s, patch){
  Object.assign(s, patch);
  if(state.online && !String(s.id).startsWith('s-')){
    try{ await api.updateSug(s.id, patch); }catch(e){ toast('No se pudo guardar: '+e.message); }
  }
}

/* --- acciones --- */
async function sugAPendientes(s){
  const rec = {titulo:s.titulo, autor:s.autor, genero:s.genero || generoDelAutor(s.autor), paginas:s.paginas,
               editorial:s.editorial, anio_pub:s.anio, portada:s.portada||null,
               estado:'pendiente', observaciones:null, nota:null, anio_lectura:null};
  if(state.online){
    try{ state.books.push(await api.create(rec)); }
    catch(e){ toast('No se pudo añadir: '+e.message); return; }
  } else {
    state.books.push(Object.assign({id:'demo-'+Date.now()}, rec));
  }
  await persistSug(s, {estado:'aceptada'});
  refreshFilters(); renderSug();
  toast('«'+s.titulo+'» añadido a Pendientes');
}

/* --- automáticas: más de los autores que puntúas alto --- */
async function autoSugerencias(){
  const porAutor = new Map();
  state.books.filter(b => b.estado !== 'pendiente' && b.nota != null && b.autor).forEach(b => {
    const a = porAutor.get(b.autor) || {n:0, suma:0};
    a.n++; a.suma += b.nota; porAutor.set(b.autor, a);
  });
  const favoritos = [...porAutor.entries()]
    .map(([autor,v]) => ({autor, media: v.suma/v.n, n: v.n}))
    .filter(a => a.media >= 8)
    .sort((x,y) => y.media - x.media || y.n - x.n)
    .slice(0, 6);

  const out = [];
  for(const f of favoritos){
    let items = [];
    try{ items = await olSearch('author:"'+f.autor+'"', 20, 'spa'); }catch(e){ continue; }
    const vistos = new Set();
    for(const it of items){
      if(!it.portada || yaLoTengo(it.titulo)) continue;
      if(!normTxt(it.autor).includes(normTxt(f.autor).split(' ').pop())) continue;
      const k = normTxt(it.titulo);
      if(vistos.has(k)) continue;
      vistos.add(k);
      out.push({titulo: it.titulo, autor: f.autor, anio: it.anio_pub, paginas: it.paginas,
                editorial: it.editorial, portada: it.portada,
                motivo: 'Le pones un '+f.media.toFixed(1)+' de media a '+f.autor+' ('+f.n+' libro'+(f.n>1?'s':'')+'), y este no lo tienes.'});
      if(vistos.size >= 4) break;
    }
  }
  return out;
}

/* --- render --- */
function sugCard(s, acciones){
  return `<div class="sug" data-sid="${esc(s.id ?? s.titulo)}">
    <div class="sug-cover">${s.portada
      ? '<img src="'+esc(s.portada)+'" alt="" loading="lazy" onerror="this.remove()">'
      : '<div class="ph"><b>'+esc(s.titulo)+'</b></div>'}</div>
    <div class="sug-info">
      <div class="sug-t">${esc(s.titulo)}</div>
      <div class="sug-a">${esc(s.autor||'')}${s.anio ? ' · '+s.anio : ''}${s.editorial ? ' · '+esc(s.editorial) : ''}${s.paginas ? ' · '+s.paginas+' págs.' : ''}</div>
      <div class="sug-m">${esc(s.motivo||'')}</div>
      ${acciones ? `<div class="sug-btns">
        <button class="btn primary" data-act="add">Añadir a pendientes</button>
        <button class="btn" data-act="drop">No me interesa</button>
        <button class="btn" data-act="cover" title="Buscar otra portada">Portada</button>
      </div>` : ''}
    </div>
  </div>`;
}

function renderSug(){
  const host = $('#view-sug');
  const activas = state.sug.filter(s => s.estado === 'nueva' && !yaLoTengo(s.titulo));
  const fuera   = state.sug.filter(s => s.estado !== 'nueva' || yaLoTengo(s.titulo));

  let html = '';
  if(state.sugError){
    html += '<div class="banner err" style="margin-bottom:18px"><span>⚠️</span><div>No he podido leer la tabla de sugerencias en Supabase (<code>'
         + esc(String(state.sugError.message).slice(0,120)) + '</code>). Te enseño la lista, pero lo que marques no se guardará. Falta por ejecutar <b>sugerencias.sql</b>.</div></div>';
  }
  for(const k of ['autores','nuevos','descubrir']){
    const items = activas.filter(s => s.bloque === k);
    if(!items.length) continue;
    html += `<section class="sug-block">
      <h3>${BLOQUES[k].t}</h3><div class="sub">${BLOQUES[k].s}</div>
      <div class="sug-list">${items.map(s => sugCard(s, true)).join('')}</div>
    </section>`;
  }
  if(!activas.length) html += '<div class="empty"><h3>Sin sugerencias pendientes</h3><p>Las has revisado todas. Pídeme una tanda nueva cuando quieras.</p></div>';

  html += `<section class="sug-block">
    <h3>Más de tus autores favoritos</h3>
    <div class="sub">Calculado solo con tus notas: autores con media de 8 o más. Se actualiza según vas puntuando.</div>
    <div class="sug-list" id="autoList"><p style="color:var(--text-muted);font-size:13.5px"><span class="spin"></span> Buscando…</p></div>
  </section>`;

  if(fuera.length){
    html += `<section class="sug-block">
      <button class="btn" id="toggleFuera">${state.verDescartadas ? 'Ocultar' : 'Ver'} las ${fuera.length} ya resueltas</button>
      ${state.verDescartadas ? '<div class="sug-list" style="margin-top:14px;opacity:.6">'+fuera.map(s=>sugCard(s,false)).join('')+'</div>' : ''}
    </section>`;
  }
  host.innerHTML = html;

  host.querySelectorAll('.sug [data-act]').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('.sug');
    const s = state.sug.find(x => String(x.id) === card.dataset.sid);
    if(!s) return;
    if(btn.dataset.act === 'add') await sugAPendientes(s);
    else if(btn.dataset.act === 'cover') openCoverPicker(s, renderSug, async patch => persistSug(s, patch));
    else { await persistSug(s, {estado:'descartada'}); renderSug(); }
  });
  const tf = host.querySelector('#toggleFuera');
  if(tf) tf.onclick = () => { state.verDescartadas = !state.verDescartadas; renderSug(); };

  pintarAuto();
  completarPortadasSug(activas);
}

async function pintarAuto(){
  const host = $('#autoList');
  if(!host) return;
  let items = [];
  try{ items = await autoSugerencias(); }catch(e){}
  const h = $('#autoList');
  if(!h) return;
  h.innerHTML = items.length
    ? items.map(s => sugCard(s, false)).join('')
    : '<p style="color:var(--text-muted);font-size:13.5px">No he encontrado nada nuevo de tus autores favoritos ahora mismo.</p>';
}

/* busca portada para las sugerencias que no la tengan */
const SUG_PORTADAS = new Map(SUG_SEED.filter(s => s.portada).map(s => [normTxt(s.titulo), s.portada]));

async function completarPortadasSug(items){
  // 1) las que ya traigo yo resueltas
  let n = 0;
  for(const s of items.filter(x => !x.portada)){
    const hit = SUG_PORTADAS.get(normTxt(s.titulo));
    if(hit){ await persistSug(s, {portada: hit}); renderSugSoft(s); n++; }
  }
  // 2) el resto, al catálogo. Un fallo NO detiene a los demás.
  for(const s of items.filter(x => !x.portada)){
    try{
      const hit = await resolveCover({titulo:s.titulo, autor:s.autor});
      if(hit && hit.portada){ await persistSug(s, {portada: hit.portada}); renderSugSoft(s); }
    }catch(e){ /* seguimos con el siguiente */ }
    await new Promise(r => setTimeout(r, 200));
  }
}
/* refresco puntual de una tarjeta, para no repintar toda la pestaña */
function renderSugSoft(s){
  const card = document.querySelector('.sug[data-sid="'+CSS.escape(String(s.id))+'"] .sug-cover');
  if(card && s.portada) card.innerHTML = '<img src="'+esc(s.portada)+'" alt="" loading="lazy" onerror="this.remove()">';
}

function exportar(){
  const m = openModal(`
    <header><h2>Exportar biblioteca</h2><button class="close" aria-label="Cerrar">×</button></header>
    <div class="body">
      <p style="color:var(--text-secondary);font-size:13.5px;margin:0 0 16px">
        Descarga tus ${state.books.length} libros con todos los campos, incluida la URL de cada carátula.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="xCsv">CSV (Excel)</button>
        <button class="btn" id="xJson">JSON</button>
      </div>
    </div>`, 'sm');
  const cols = ['titulo','autor','genero','paginas','nota','anio_lectura','estado','favorito','editorial','anio_pub','isbn','observaciones','sinopsis','sinopsis_fuente','rating_ext','rating_votos','rating_fuente','portada'];
  const dl = (name, txt, mime) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {type:mime}));
    a.download = name; a.click(); URL.revokeObjectURL(a.href); m.remove(); toast('Descargado ' + name);
  };
  m.querySelector('#xCsv').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    dl('mi-biblioteca.csv', '﻿' + [cols.map(c => c === 'observaciones' ? 'opinion' : c).join(';')].concat(state.books.map(b=>cols.map(c=>q(b[c])).join(';'))).join('\n'), 'text/csv;charset=utf-8');
  };
  m.querySelector('#xJson').onclick = () =>
    dl('mi-biblioteca.json', JSON.stringify(state.books.map(b=>Object.fromEntries(cols.map(c=>[c,b[c]??null]))), null, 2), 'application/json');
}

   ARRANQUE
   ================================================================ */
function setTab(t){
  state.tab = t;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  const stats = t === 'stats', sug = t === 'sugerencias';
  $('#view-list').classList.toggle('hidden', stats || sug);
  $('#view-stats').classList.toggle('hidden', !stats);
  $('#view-sug').classList.toggle('hidden', !sug);
  if(stats) renderStats();
  else if(sug){ cargarSugerencias().then(renderSug); }
  else render();
}

function wire(){
  $$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  ['#q','#fAutor','#fGenero','#fAnio','#fNota','#fSort'].forEach(s => {
    $(s).addEventListener(s === '#q' ? 'input' : 'change', render);
  });
  $('#btnAdd').onclick = openSearch;
  $('#btnFiltros').onclick = () => $('#filtros').classList.toggle('abierto');
  $('#btnCovers').onclick = openCoverReview;
  $('#btnExport').onclick = exportar;
  $('#btnView').onclick = () => { state.view = state.view === 'galeria' ? 'tabla' : 'galeria'; render(); };
  const ICON_MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const ICON_SUN  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const paintTheme = () => { $('#btnTheme').innerHTML = document.documentElement.dataset.theme === 'dark' ? ICON_SUN : ICON_MOON; };
  paintTheme();
  $('#btnTheme').onclick = () => {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    paintTheme();
  };
}

(async function init(){
  wire();
  await load();
  refreshFilters();
  render();
  fillCovers();
})();
</script>
</body>
</html>
